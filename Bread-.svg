  <g id="viewer" style="display:none">
    <rect id="viewerbg" width="800" height="900" fill="#07080b"/>
    <text class="title" id="vtitle" x="40" y="68" style="font-size:26px"></text>
    <rect x="40" y="80" width="64" height="3" rx="1.5" fill="url(#accent)"/>
    <text class="sub" id="vstat" x="40" y="108">loading…</text>
    <g id="vback" transform="translate(640,36)" style="cursor:pointer">
      <rect width="120" height="36" rx="8" fill="#12151c" stroke="#3b4358"/>
      <text x="60" y="23" text-anchor="middle" style="font-size:13px;fill:#e8ebf2">← files</text>
    </g>
    <foreignObject id="fo" x="40" y="124" width="720" height="740">
      <div xmlns="http://www.w3.org/1999/xhtml" id="vbox" style="width:720px;height:740px;overflow:auto;box-sizing:border-box;background:#0d0f14;border:1px solid #1f2430;border-radius:10px;padding:14px 16px;color-scheme:dark;">
        <pre id="vpre" style="margin:0;font:12px/1.5 Consolas,Menlo,monospace;color:#cfd6e4;white-space:pre-wrap;word-break:break-all;"></pre>
      </div>
    </foreignObject>
  </g>

  <script><![CDATA[
  (function () {
    var CHUNK = 512 * 1024, cur = null;
    var viewer = document.getElementById('viewer'),
        box = document.getElementById('vbox'),
        pre = document.getElementById('vpre'),
        title = document.getElementById('vtitle'),
        stat = document.getElementById('vstat');

    function fmt(n) {
      if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
      if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
      return Math.round(n / 1024) + ' KB';
    }
    function status() {
      if (!cur) return;
      if (cur.err) { stat.textContent = cur.err; return; }
      stat.textContent = (cur.busy ? 'loading…  ·  ' : '') + 'loaded ' + fmt(cur.offset) +
        (cur.total ? ' of ' + fmt(cur.total) : '') + (cur.done ? '  ·  end of file' : '  ·  scroll for more');
    }

    async function more() {
      if (!cur || cur.busy || cur.done || cur.err) return;
      var c = cur;
      c.busy = true; status();
      try {
        var r = await fetch(c.url, {
          headers: { Range: 'bytes=' + c.offset + '-' + (c.offset + CHUNK - 1) },
          signal: c.ctl.signal
        });
        if (r.status === 416) {
          c.done = true;
        } else if (!(r.status === 206 || (r.status === 200 && c.offset === 0))) {
          throw new Error('HTTP ' + r.status);
        } else {
          var cr = r.headers.get('Content-Range'), m = cr && /\/(\d+)$/.exec(cr);
          if (m) c.total = +m[1];
          else if (r.status === 200) { var cl = r.headers.get('Content-Length'); if (cl) c.total = +cl; }
          var rd = r.body.getReader(), got = 0, parts = [];
          while (got < CHUNK) {
            var x = await rd.read();
            if (x.done) break;
            var v = x.value;
            if (got + v.length > CHUNK) v = v.subarray(0, CHUNK - got);
            parts.push(v); got += v.length;
          }
          try { rd.cancel(); } catch (e) {}
          var buf = new Uint8Array(got), p = 0;
          parts.forEach(function (a) { buf.set(a, p); p += a.length; });
          pre.appendChild(document.createTextNode(c.dec.decode(buf, { stream: true })));
          c.offset += got;
          if (got === 0 || (c.total && c.offset >= c.total)) c.done = true;
        }
      } catch (e) {
        if (e.name !== 'AbortError')
          c.err = 'error: ' + e.message + '  (if this SVG is hosted on another domain, add a CORS rule to the bucket)';
      }
      c.busy = false;
      if (cur === c) {
        status();
        if (!c.done && !c.err && box.scrollHeight <= box.clientHeight + 50) more();
      }
    }

    function openFile(url) {
      cur = { url: url, offset: 0, total: 0, done: false, busy: false, err: '',
              ctl: new AbortController(), dec: new TextDecoder('utf-8') };
      pre.textContent = '';
      box.scrollTop = 0;
      title.textContent = url.split('/').pop();
      viewer.style.display = 'block';
      more();
    }
    function closeFile() {
      if (cur) { cur.ctl.abort(); cur = null; }
      viewer.style.display = 'none';
      pre.textContent = '';
    }

    Array.prototype.forEach.call(document.querySelectorAll('a.row'), function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        openFile(a.getAttribute('href'));
      });
    });
    document.getElementById('vback').addEventListener('click', closeFile);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeFile(); });
    box.addEventListener('scroll', function () {
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 300) more();
    });

    var svg = document.documentElement;
    function layout() {
      var W = Math.max(900, window.innerWidth);
      svg.setAttribute('viewBox', '0 0 ' + W + ' 900');
      document.getElementById('bgrect').setAttribute('width', W);
      document.getElementById('viewerbg').setAttribute('width', W);
      document.getElementById('glow2').setAttribute('cx', W - 120);
      document.getElementById('footer').setAttribute('x', W / 2);
      document.getElementById('vback').setAttribute('transform', 'translate(' + (W - 160) + ',36)');
      document.getElementById('fo').setAttribute('width', W - 80);
      box.style.width = (W - 80) + 'px';

      Array.prototype.forEach.call(document.querySelectorAll('rect.card'), function (r) {
        r.setAttribute('width', W - 80);
      });
      Array.prototype.forEach.call(document.querySelectorAll('text.open'), function (t) {
        t.setAttribute('x', W - 100);
      });
    }
    window.addEventListener('resize', layout);
    layout();
  })();
  ]]></script>
