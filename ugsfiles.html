const list = document.getElementById("list");
const q = document.getElementById("q");
const code = document.getElementById("code");
const empty = document.getElementById("empty");
const current = document.getElementById("current");
const downloadBtn = document.getElementById("download");
const count = document.getElementById("count");
let currentName = "";
let currentText = "";

function fileUrl(name){
  return "https://archive.org/cors/ugsfiles/" + encodeURIComponent(name).replace(/%2F/g, "/");
}
function save(name, text){
  const blob = new Blob([text], {type: "text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
async function fetchText(name){
  const res = await fetch(fileUrl(name));
  if (!res.ok) throw new Error("HTTP " + res.status);
  return await res.text();
}
async function loadFile(name, row){
  document.querySelectorAll(".item.active").forEach(el => el.classList.remove("active"));
  if (row) row.classList.add("active");
  currentName = name;
  currentText = "";
  downloadBtn.disabled = true;
  empty.hidden = true;
  code.hidden = false;
  code.textContent = "Loading " + name + "…";
  current.textContent = name;
  try {
    const text = await fetchText(name);
    currentText = text;
    const cap = 1500000;
    code.textContent = text.length > cap
      ? text.slice(0, cap) + "\n\n… truncated in the viewer (" + text.length.toLocaleString() + " characters). Download still saves the full file."
      : text;
    downloadBtn.disabled = false;
    current.textContent = name + "  ·  " + text.length.toLocaleString() + " characters";
  } catch (err) {
    code.textContent = "Could not load " + name + ".\n" + err;
    current.textContent = name + "  ·  failed";
  }
}
async function downloadName(name, btn){
  const old = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  try {
    const text = (name === currentName && currentText) ? currentText : await fetchText(name);
    save(name, text);
  } catch (err) {
    alert("Download failed for " + name + ": " + err);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = old || "Download"; }
  }
}
function render(){
  const term = q.value.trim().toLowerCase();
  const shown = FILES.filter(f => !term || f.n.toLowerCase().includes(term));
  count.textContent = shown.length + " of " + FILES.length + " files";
  list.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const f of shown){
    const row = document.createElement("div");
    row.className = "item";
    row.dataset.name = f.n;
    const b = document.createElement("b");
    b.textContent = f.n;
    const s = document.createElement("span");
    s.textContent = f.l;
    const dl = document.createElement("button");
    dl.className = "dl";
    dl.type = "button";
    dl.textContent = "Download";
    dl.onclick = (ev) => { ev.stopPropagation(); downloadName(f.n, dl); };
    row.append(b, s, dl);
    row.onclick = () => loadFile(f.n, row);
    frag.append(row);
  }
  list.append(frag);
}
downloadBtn.onclick = () => { if (currentName) downloadName(currentName, downloadBtn); };
q.oninput = render;
render();
</script>
